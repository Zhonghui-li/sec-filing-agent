name: Eval

# Two-layer eval gate:
#   L1 (every push / PR) -> deterministic unit tests, no LLM, no secrets, must pass.
#   L2 (manual dispatch) -> full agent eval + regression gate vs eval/baseline.json.
# L2 is manual-only so the shared lab OPENAI_API_KEY isn't run unattended in a public repo.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  l1-deterministic:
    name: L1 deterministic tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest pandas
      - name: L1 — tools + scorer logic (no LLM / DB / secrets)
        run: python -m pytest tests/ -q

  # L1 runs against requirements.txt. The image installs service/requirements.txt. Until this job
  # existed, nothing built the image, so on 2026-10-11 two defects reached production in one
  # afternoon that no local check could see: langchain-core 0.3.x (where `.text` is a method, not
  # a property) and pyarrow 26 against a pinned numpy 1.26.4. Both are properties of the resolved
  # dependency set, so neither needs a key, a database or a cent to catch — see service/smoke.py.
  l1b-image:
    name: L1b image builds, imports and serves
    runs-on: ubuntu-latest
    # The app cannot start without one: lifespan calls _ensure_doc_schema, which reads
    # os.environ["DATABASE_URL"] and raises KeyError when it is absent. A throwaway instance is
    # enough — this job never asks a question, so nothing reads a filing out of it.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Build the image the way Cloud Build does
        run: docker build -f service/Dockerfile -t sec-filing-agent:ci .
      - name: Contracts the installed dependency set must satisfy
        run: docker run --rm sec-filing-agent:ci python -m service.smoke
      # The suite, run against the versions that SHIP rather than the ones a dev venv happens to
      # hold. This is the lane that directly answers the 2026-10-11 root cause — tests passing in
      # one environment while a different one was deployed. It is also the only place
      # tests/test_model_knobs.py actually executes: L1 installs pytest and pandas only, so it
      # skips there, and L2 has never run.
      #
      # DATABASE_URL is deliberately NOT passed: the filings-cache tests skip without it, the same
      # way they do locally, and pointing them at the empty throwaway postgres would turn skips
      # into errors. The key is a placeholder because ChatOpenAI validates that one exists at
      # construction; no request is made.
      - name: The suite, against the versions that ship
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e PYTHONPATH=/src \
            -e OPENAI_API_KEY=ci-construction-only-not-a-real-key \
            sec-filing-agent:ci \
            sh -c "pip install -q pytest && python -m pytest tests/ -q"
      # A liveness probe alone would have passed on 10-11: the app started fine and only
      # narrative questions failed. It is here to catch the startup failures smoke.py cannot,
      # not as the main check. The key is a placeholder — build_agent() constructs ChatOpenAI at
      # startup, which validates that a key EXISTS; no request is made and nothing is billed.
      # --network host so the container reaches the postgres service on localhost, the same way
      # it reaches its own port 8080 from the runner.
      - name: Container starts and serves /health
        run: |
          docker run -d --name ci --network host \
            -e OPENAI_API_KEY=ci-construction-only-not-a-real-key \
            -e DATABASE_URL=postgresql://postgres:ci@localhost:5432/ci \
            sec-filing-agent:ci
          ok=
          for _ in $(seq 1 45); do
            if curl -fsS http://localhost:8080/health >/dev/null; then ok=1; break; fi
            sleep 2
          done
          docker logs ci
          docker rm -f ci
          test -n "$ok"
      # What a clean linux resolve actually picked. requirements.txt states ranges; this is the
      # record of which versions those ranges became, on the platform that serves traffic, and is
      # the raw material for pinning them properly.
      - name: Record the resolved linux dependency set
        run: docker run --rm sec-filing-agent:ci pip freeze > resolved-linux.txt
      - uses: actions/upload-artifact@v4
        with:
          name: resolved-linux
          path: resolved-linux.txt

  l2-agent-eval:
    name: L2 agent eval vs baseline
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      EMB_MODEL: text-embedding-3-small
      # Match production (service/deploy.sh). The default model moved to o4-mini in 138a3b9, which
      # updated the agent, observability, the FinanceBench harness and deploy.sh — and missed this
      # file, so every manual L2 run since has scored a model that was replaced three months ago,
      # and replaced precisely because its tool routing was unstable.
      #
      # Moved off o4-mini on 2026-10-12, ahead of its 2026-10-23 shutdown, to gpt-5.4-mini —
      # Phase 1.7, eval/_migration_17_round3/RESULTS.md. The count in this comment was wrong
      # twice before that (first "three places", then "four"); the Python side was six call
      # sites, two of which only RECORD which model ran, where drift does not break a run, it
      # mislabels it. They all read agents.DEFAULT_GEN_MODEL now, so the Python side is ONE
      # edit. Two sites cannot import it and must be changed by hand with it: this line, and
      # service/deploy.sh's --set-env-vars.
      GEN_LLM_MODEL: gpt-5.4-mini
      REASONING_EFFORT: low
      # Explicit although it is also the code default, for the same reason REASONING_EFFORT is:
      # a default that is not what ships makes "run it locally" mean something else. Set to 0 to
      # score the legacy chat/completions path.
      RESPONSES_API: "1"
      RERANK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      # --quality is gone with ragas: it imported a module langchain-community removed, from a
      # package being sunset, and holding that back pins langchain-core to 0.3.x. See
      # requirements.txt. The deterministic metrics and the regression gate are unaffected.
      - name: L2 — full agent eval + regression gate (exits non-zero on regression)
        run: python -m eval.score
